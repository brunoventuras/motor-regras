name: motor-regras

services:
  app:
    build: .
    image: motor-regras-app:1.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-emtec}:${POSTGRES_PASSWORD:-emtec}@postgres:5432/${POSTGRES_DB:-motor_regras}
      JWT_SEGREDO: ${JWT_SEGREDO:-troque-este-segredo}
      JWT_EXPIRACAO: ${JWT_EXPIRACAO:-8h}
    ports:
      - '${PORTA_APP:-3000}:3000'

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-emtec}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-emtec}
      POSTGRES_DB: ${POSTGRES_DB:-motor_regras}
    ports:
      - '127.0.0.1:${POSTGRES_PORTA_HOST:-5432}:5432'
    volumes:
      - dados_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dados_postgres:
